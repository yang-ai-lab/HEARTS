<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>HEARTS</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // The site is now a single page. Old deep links from the previous SPA
      // (/HEARTS/about, /HEARTS/submit, /HEARTS/leaderboard, ...) are mapped to the
      // corresponding in-page anchor so existing bookmarks keep working.
      (function () {
        var seg = location.pathname
          .replace(/^\/HEARTS\/?/, '')
          .replace(/\/$/, '')
          .split('/')[0]
          .toLowerCase();
        var known = { home: 1, leaderboard: 1, about: 1, submit: 1, citation: 1 };
        var anchor = known[seg] ? '#' + seg : '';
        location.replace('/HEARTS/' + anchor);
      })();
    </script>
  </head>
  <body>
    <p>Redirecting to <a href="/HEARTS/">HEARTS</a>…</p>
  </body>
</html>
